<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JARP3X Networks</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="pagina-login">

    <div class="login-container">

      <div class="login-box">
        <div class="login-logo">
          <h1>JARP3X<span>Networks</span></h1>
        </div>

        <h2>Iniciar Sesión</h2>
        <p class="login-subtitulo">Ingresa tus datos para continuar</p>

        <form id="form-login">

          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ingresa tu usuario">

          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña">

          <button type="submit" class="btn-primary">Ingresar</button>

        </form>

        <p class="login-volver"><a href="index.html">← Volver al inicio</a></p>
      </div>

    </div>

    <script src="login.js"></script>

  </body>

</html>
