<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JARP3X Networks</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <!-- ENCABEZADO -->
    <header>
      <div class="hero">
        <h1>JARP3X Networks</h1>
        <p>Equipos y servicios de tecnología para tu negocio</p>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

      <div class="login-box">
        <h2>Iniciar Sesión</h2>

        <form id="form-login">

  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" placeholder="Ingresa tu usuario">

  <label for="password">Contraseña:</label>
  <input type="password" id="password" placeholder="Ingresa tu contraseña">

  <button type="submit">Ingresar</button>

</form>

      </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
      <p>© 2025 JARP3X Networks - Todos los derechos reservados</p>
    </footer>
<script src="login.js"></script>
  </body>

</html>
