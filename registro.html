<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JARP3X Networks</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="pagina-login">

    <div class="login-container">
      <div class="login-box">

        <div class="login-logo">
          <h1>JARP3X<span>Networks</span></h1>
        </div>

        <h2>Crear cuenta</h2>
        <p class="login-subtitulo">Regístrate para empezar a comprar</p>

        <form id="form-registro">

          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Tu nombre completo">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com">

          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres">

          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" placeholder="Repite tu contraseña">

          <button type="submit" class="btn-primary">Registrarse</button>

        </form>

        <p class="login-volver">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>

      </div>
    </div>

    <script src="registro.js"></script>

  </body>

</html>
